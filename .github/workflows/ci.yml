name: CI

on:
  push:
    branches: ["**"]          # 所有分支；tag 推送不匹配此过滤器，因此不会重复触发
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (Obsidian plugin guidelines)
        run: npm run lint

      - name: Test, lint, typecheck and build
        run: npm run check
